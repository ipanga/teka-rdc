# TEMPORARY diagnostic workflow — queries the Sentry API for the most recent
# production errors on the teka-api project and prints the stack traces to the
# run log. Used to root-cause the /v1/sellers/* 500s. Safe/read-only (only GETs
# against Sentry). Delete after the investigation.
name: Sentry diagnose

on:
  workflow_dispatch:
    inputs:
      filter:
        description: "Regex to match issues (title/culprit/value)"
        required: false
        default: "sellers|earning|payout|wallet|prisma|column|relation"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Query Sentry for recent prod API errors
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          FILTER: ${{ github.event.inputs.filter }}
        run: |
          set -uo pipefail
          API="https://de.sentry.io/api/0"
          ORG="teka-rdc"
          PROJ="teka-api"
          AUTH="Authorization: Bearer ${SENTRY_AUTH_TOKEN}"

          echo "::group::Recent unresolved production issues (last 24h)"
          curl -sS -H "$AUTH" \
            "$API/projects/$ORG/$PROJ/issues/?query=is:unresolved&environment=production&statsPeriod=24h&limit=25" \
            -o issues.json
          echo "HTTP fetch done. Summary:"
          jq -r '.[] | "[\(.id)] count=\(.count) lastSeen=\(.lastSeen)\n  title: \(.title)\n  culprit: \(.culprit)\n  value: \(.metadata.value // "")"' issues.json 2>/dev/null \
            || { echo "Non-array response (likely auth/scope error):"; cat issues.json; }
          echo "::endgroup::"

          echo "::group::Matching issues -> latest event stack traces"
          ids=$(jq -r --arg re "$FILTER" '
            .[] | select(
              ((.title // "") + " " + (.culprit // "") + " " + (.metadata.value // ""))
              | ascii_downcase | test($re; "i")
            ) | .id' issues.json 2>/dev/null | head -5)
          if [ -z "$ids" ]; then
            echo "No issues matched /$FILTER/. Showing latest event of the single most recent issue instead."
            ids=$(jq -r '.[0].id // empty' issues.json 2>/dev/null)
          fi
          for id in $ids; do
            echo "================ ISSUE $id ================"
            curl -sS -H "$AUTH" "$API/issues/$id/events/latest/" -o ev.json
            jq -r '
              "TITLE:   " + (.title // "") ,
              "CULPRIT: " + (.culprit // "") ,
              "MESSAGE: " + ((.message // "") | tostring),
              "TAGS:    " + ([(.tags // [])[] | "\(.key)=\(.value)"] | join(", ")),
              "---- EXCEPTION ----",
              ( [ (.entries // [])[] | select(.type=="exception") | .data.values[]?
                  | "TYPE:  \(.type)\nVALUE: \(.value)\nFRAMES:",
                    ( [ (.stacktrace.frames // [])[]
                        | "  \(.filename // .module // "?"):\(.lineNo // "?")  \(.function // "")" ]
                      | reverse | .[0:12] | join("\n") )
                ] | join("\n") )
            ' ev.json 2>/dev/null || { echo "Could not parse event (scope?):"; head -c 2000 ev.json; }
            echo
          done
          echo "::endgroup::"
