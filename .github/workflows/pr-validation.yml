# Runs on every pull request targeting main.
# Blocks merging if typecheck/tests fail, or if any of the 4 Dockerfiles
# fail to build. Lint runs but does not block (tracked as tech debt).
name: PR validation

on:
  pull_request:
    branches: [main]

# Least privilege (PR 5): the workflow token can only read the repo; jobs that
# need more declare it themselves.
permissions:
  contents: read

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @teka/shared build

      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/teka_ci

      # Non-blocking — the existing codebase has ~3k strict-typecheck-style
      # ESLint errors (mostly unsafe-any in Jest test utilities). Tracked as
      # tech debt; failures are surfaced in the action log but don't block PRs.
      - name: Lint (non-blocking)
        run: pnpm lint
        continue-on-error: true

      - name: Typecheck
        run: pnpm type-check

      - name: Unit tests
        run: pnpm --filter api test -- --passWithNoTests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://ci:ci@localhost:5432/teka_ci
          JWT_SECRET: test-jwt-secret-for-ci
          JWT_REFRESH_SECRET: test-refresh-secret-for-ci

      - name: E2e tests
        run: pnpm --filter api test:e2e
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://ci:ci@localhost:5432/teka_ci
          JWT_SECRET: test-jwt-secret-for-ci
          JWT_REFRESH_SECRET: test-refresh-secret-for-ci
          SMS_PROVIDER: mock
          RESEND_API_KEY: ''
          AT_API_KEY: ''
          GOOGLE_WEB_CLIENT_ID: test-web-client-id

  docker-build-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api,        dockerfile: apps/api/Dockerfile }
          - { name: buyer-web,  dockerfile: apps/buyer-web/Dockerfile }
          - { name: seller-web, dockerfile: apps/seller-web/Dockerfile }
          - { name: admin-web,  dockerfile: apps/admin-web/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build ${{ matrix.name }} (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
