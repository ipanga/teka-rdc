name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @teka/shared build

      # Prisma Client types are generated into node_modules and must exist
      # before the API can be type-checked.
      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate
        env:
          # Any valid-looking Postgres URL works — prisma generate does not connect.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/teka_ci

      - name: Type check
        run: pnpm type-check

  test-api:
    name: API Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @teka/shared build

      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/teka_ci

      # Unit tests with Jest default config find 0 matches under src/ — the real
      # test surface is the e2e suite under apps/api/test/ which mocks Prisma
      # (no live DB needed). --passWithNoTests also guards the src/ step.
      - name: Run API unit tests (noop — e2e covers real cases)
        run: pnpm --filter api test -- --passWithNoTests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://ci:ci@localhost:5432/teka_ci
          JWT_SECRET: test-jwt-secret-for-ci
          JWT_REFRESH_SECRET: test-refresh-secret-for-ci

      - name: Run API e2e tests
        run: pnpm --filter api test:e2e
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://ci:ci@localhost:5432/teka_ci
          JWT_SECRET: test-jwt-secret-for-ci
          JWT_REFRESH_SECRET: test-refresh-secret-for-ci
          SMS_PROVIDER: mock
          RESEND_API_KEY: ''
          AT_API_KEY: ''
          GOOGLE_WEB_CLIENT_ID: test-web-client-id

  flutter-analyze:
    name: Flutter Analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [buyer-mobile, seller-mobile]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        working-directory: apps/${{ matrix.app }}
        run: flutter pub get

      # buyer-mobile dropped the gen-l10n layer (2026-06-22, French literals).
      # Only run for apps that still have an l10n.yaml (seller-mobile for now).
      - name: Generate l10n (if configured)
        working-directory: apps/${{ matrix.app }}
        run: |
          if [ -f l10n.yaml ]; then flutter gen-l10n; else echo "no l10n.yaml — skipping gen-l10n"; fi

      # --no-fatal-infos keeps existing deprecation notices (withOpacity,
      # groupValue, encryptedSharedPreferences) from breaking the build.
      # Real errors and warnings still fail.
      - name: Analyze
        working-directory: apps/${{ matrix.app }}
        run: flutter analyze --no-fatal-infos

  release-config:
    name: Release Config
    runs-on: ubuntu-latest
    # This job only reads the checkout and runs a Ruby script — no token use at
    # all. Scoped explicitly (the other jobs in this file predate the
    # convention and are left alone).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      # Guards the app → TestFlight tester-group mapping and the three
      # upload_to_testflight flags that decide whether a build reaches anyone.
      # All three were wrong until 2026-08-09: five releases uploaded cleanly
      # and were distributed to nobody, because a build with no tester group is
      # never sent and never emailed. Pure source parsing — no fastlane, no
      # network, no App Store Connect credentials.
      - name: TestFlight distribution config
        run: ruby fastlane/testflight_groups_test.rb
