# Mobile release build — signed production App Bundle (AAB) → Google Play
# testing track (Android mirror of "Release mobile IPA").
#
# Triggered manually from the Actions tab → "Release mobile AAB" → Run workflow.
# Produces a release-signed, production-flavor `.aab`, then (after a human
# approves the `android-play` environment) uploads it to a Play TESTING track.
# Unlike "Build mobile APK" (debug-signed APKs for internal install), this signs
# with the real upload keystore and outputs an App Bundle.
#
# Inputs:
#   app      = buyer | seller | both   (default: buyer)
#   track    = internal | alpha        (default: internal) — NEVER production
#   dry_run  = validate against Play and publish nothing (default: false)
#   skip_upload = build the artifact only, no Play job at all (default: false)
#
# Flow (per app):
#   build job      → keystore → flutter build appbundle → dSYM/symbols → Sentry
#                    → .aab artifact (+ mapping.txt artifact)
#   [approval gate]  the `play` job is bound to the protected `android-play`
#                    GitHub Environment; a reviewer must approve before it runs.
#   play job       → download .aab + mapping.txt → fastlane android upload_play
#
# PRODUCTION IS NOT AUTOMATED, by two independent locks: the `track` input has
# no production option and the Fastfile refuses it, and the Play service account
# is granted testing-track permission only. Both apps are already live; an
# automated production push reaches every user on auto-update and cannot be
# recalled. Promote from a testing track in the Play Console, by hand.
#
# Always builds the `production` flavor in `release` mode — there is no reason
# to upload a dev/staging or debug bundle to Play.
#
# Required GitHub Secrets (per app — buyer + seller have SEPARATE keystores):
#   <APP>_UPLOAD_KEYSTORE_B64      base64 of the upload keystore (.jks)
#   <APP>_KEYSTORE_PASSWORD        keystore (store) password
#   <APP>_KEY_PASSWORD             key password
#   <APP>_KEY_ALIAS                key alias
#   <APP>_GOOGLE_SERVICES_JSON_B64 base64 of android/app/google-services.json
# Optional: POSTHOG_API_KEY (shared publishable phc_ key → mobile analytics;
#           empty → PostHog no-op), SENTRY_DSN_<APP>_MOBILE, SENTRY_AUTH_TOKEN (symbol upload).
#
# Required for the Play upload job (ONE secret, shared by both apps — unlike the
# per-app keystores and the per-app App Store Connect keys):
#   PLAY_SERVICE_ACCOUNT_JSON_B64  base64 of the Google Play service-account JSON
#
# One-time operator setup (service account, Play Console permissions, the
# android-play environment + reviewers): see docs/mobile-release.md.
#
# Generate the keystore + populate the secrets per docs/mobile-release.md.
# When the signing secrets are absent the build would fall back to debug
# signing — so this workflow FAILS FAST if they're missing, to avoid shipping
# a debug-signed bundle by accident.
name: Release mobile AAB

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'Which app to release'
        required: true
        type: choice
        default: buyer
        options: [buyer, seller, both]
      track:
        description: 'Play testing track (production is never offered)'
        required: true
        type: choice
        default: internal
        options: [internal, alpha]
      dry_run:
        description: 'Validate against Play without publishing anything'
        required: false
        type: boolean
        default: false
      skip_upload:
        description: 'Build the AAB only — do not run the Play upload job'
        required: false
        type: boolean
        default: false

# Least privilege (PR 5): the workflow token can only read the repo; jobs that
# need more declare it themselves.
permissions:
  contents: read

concurrency:
  group: mobile-aab-${{ inputs.app }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ inputs.app == 'both' && fromJSON('["buyer","seller"]') || fromJSON(format('["{0}"]', inputs.app)) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Decode Firebase secrets onto disk
        env:
          BUYER_GOOGLE_SERVICES_JSON_B64: ${{ secrets.BUYER_GOOGLE_SERVICES_JSON_B64 }}
          SELLER_GOOGLE_SERVICES_JSON_B64: ${{ secrets.SELLER_GOOGLE_SERVICES_JSON_B64 }}
        run: bash scripts/sync-firebase-secrets.sh

      - name: Verify Firebase secret decoded
        run: |
          path="apps/${{ matrix.app }}-mobile/android/app/google-services.json"
          if [ ! -s "$path" ]; then
            echo "::error::$path missing — set ${{ matrix.app }}_GOOGLE_SERVICES_JSON_B64"
            exit 1
          fi

      - name: Fail fast if signing secrets are missing
        env:
          KS_B64: ${{ matrix.app == 'buyer' && secrets.BUYER_UPLOAD_KEYSTORE_B64 || secrets.SELLER_UPLOAD_KEYSTORE_B64 }}
        run: |
          if [ -z "${KS_B64}" ]; then
            echo "::error::${{ matrix.app }} upload keystore secret is not set — refusing to build a debug-signed bundle. See docs/mobile-release.md."
            exit 1
          fi

      - name: Decode signing keystore + write key.properties
        env:
          UPLOAD_KEYSTORE_B64: ${{ matrix.app == 'buyer' && secrets.BUYER_UPLOAD_KEYSTORE_B64 || secrets.SELLER_UPLOAD_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ matrix.app == 'buyer' && secrets.BUYER_KEYSTORE_PASSWORD || secrets.SELLER_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ matrix.app == 'buyer' && secrets.BUYER_KEY_PASSWORD || secrets.SELLER_KEY_PASSWORD }}
          KEY_ALIAS: ${{ matrix.app == 'buyer' && secrets.BUYER_KEY_ALIAS || secrets.SELLER_KEY_ALIAS }}
        run: bash scripts/sync-android-signing.sh ${{ matrix.app }}

      - name: pub get
        working-directory: apps/${{ matrix.app }}-mobile
        run: flutter pub get

      - name: Resolve per-app Sentry DSN
        id: sentry
        env:
          BUYER_DSN: ${{ secrets.SENTRY_DSN_BUYER_MOBILE }}
          SELLER_DSN: ${{ secrets.SENTRY_DSN_SELLER_MOBILE }}
        run: |
          case "${{ matrix.app }}" in
            buyer)  echo "dsn=${BUYER_DSN}"  >> "$GITHUB_OUTPUT" ;;
            seller) echo "dsn=${SELLER_DSN}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build production release AAB
        working-directory: apps/${{ matrix.app }}-mobile
        run: |
          flutter build appbundle \
            --release \
            --flavor production \
            --dart-define-from-file=flavors/production.json \
            --dart-define=SENTRY_DSN=${{ steps.sentry.outputs.dsn }} \
            --dart-define=POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }} \
            --dart-define=SENTRY_RELEASE=${{ github.sha }}

      - name: Verify the bundle is NOT debug-signed
        working-directory: apps/${{ matrix.app }}-mobile
        run: |
          aab="build/app/outputs/bundle/productionRelease/app-production-release.aab"
          if [ ! -s "$aab" ]; then echo "::error::AAB not produced at $aab"; exit 1; fi
          # The debug keystore's cert is the well-known "Android Debug" CN.
          # If the bundle's signing cert is that, signing fell back to debug.
          if unzip -p "$aab" META-INF/*.RSA 2>/dev/null | keytool -printcert 2>/dev/null | grep -q "CN=Android Debug"; then
            echo "::error::AAB appears debug-signed — signing config did not pick up key.properties"
            exit 1
          fi
          echo "✓ $aab present ($(wc -c < "$aab") bytes), not debug-signed"

      - name: Upload Sentry debug symbols
        working-directory: apps/${{ matrix.app }}-mobile
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: ${{ github.sha }}
        run: |
          if [ -z "${SENTRY_AUTH_TOKEN}" ]; then
            echo "::warning::SENTRY_AUTH_TOKEN not set — skipping symbol upload"
            exit 0
          fi
          flutter pub run sentry_dart_plugin

      - name: Upload AAB artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.app }}-mobile-production-release-aab
          path: apps/${{ matrix.app }}-mobile/build/app/outputs/bundle/productionRelease/app-production-release.aab
          retention-days: 30

      # R8 minification is ON for both apps' release builds
      # (android/app/build.gradle.kts → isMinifyEnabled = true). Without this
      # file every Play crash report and ANR is an unreadable stack of
      # obfuscated symbols. Kept as its OWN artifact so the existing
      # `*-production-release-aab` artifact keeps exactly the shape operators
      # already download by hand.
      - name: Check for the R8 mapping file
        id: mapping
        working-directory: apps/${{ matrix.app }}-mobile
        run: |
          map="build/app/outputs/mapping/productionRelease/mapping.txt"
          if [ -s "$map" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "✓ mapping.txt present ($(wc -c < "$map") bytes)"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::mapping.txt not found at $map — Play crash reports for this build will stay obfuscated"
          fi

      - name: Upload R8 mapping artifact
        if: steps.mapping.outputs.found == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.app }}-mobile-production-release-mapping
          path: apps/${{ matrix.app }}-mobile/build/app/outputs/mapping/productionRelease/mapping.txt
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────────
  # Play upload — gated on a human approving the `android-play` environment.
  # The build above has already run; only the publish waits.
  # ──────────────────────────────────────────────────────────────────────────
  play:
    needs: build
    if: ${{ !inputs.skip_upload }}
    runs-on: ubuntu-latest
    # Protected environment — a reviewer must approve before this job starts.
    environment: android-play
    strategy:
      fail-fast: false
      matrix:
        app: ${{ inputs.app == 'both' && fromJSON('["buyer","seller"]') || fromJSON(format('["{0}"]', inputs.app)) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Ruby + Fastlane
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Fail fast if the Play credential is missing
        env:
          PLAY_JSON_B64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          # -z only; the value itself is never echoed, compared in a command
          # line, or written to a file.
          if [ -z "${PLAY_JSON_B64}" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON_B64 is not set — see docs/mobile-release.md § Android Play upload."
            exit 1
          fi
          echo "✓ Play service-account secret present"

      - name: Download AAB artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ matrix.app }}-mobile-production-release-aab
          path: aab

      # The build job skips this artifact when R8 produced no mapping, so the
      # download must tolerate its absence rather than fail the release.
      - name: Download R8 mapping artifact
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ matrix.app }}-mobile-production-release-mapping
          path: mapping

      - name: Upload to Google Play
        env:
          TEKA_APP: ${{ matrix.app }}
          # The Fastfile picks the package id by TEKA_APP, so the workflow never
          # chooses which listing a bundle lands on.
          PLAY_JSON_B64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_B64 }}
          PLAY_TRACK: ${{ inputs.track }}
          PLAY_VALIDATE_ONLY: ${{ inputs.dry_run }}
        run: |
          AAB_PATH=$(ls "${GITHUB_WORKSPACE}"/aab/*.aab | head -1)
          export AAB_PATH
          MAPPING_PATH="${GITHUB_WORKSPACE}/mapping/mapping.txt"
          [ -s "${MAPPING_PATH}" ] || MAPPING_PATH=""
          export MAPPING_PATH
          echo "Uploading ${AAB_PATH} for ${TEKA_APP} → track ${PLAY_TRACK}"
          bundle exec fastlane android upload_play
