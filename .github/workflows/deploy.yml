# Runs on every push to main (i.e. after a PR merges) or a manual dispatch on
# main. Jobs:
#   environment-preflight  read-only REST check that the `production`
#                          environment exists and is protected exactly as
#                          expected — BEFORE any job references it (GitHub
#                          silently auto-creates an UNPROTECTED environment
#                          when a job names a missing one).
#   build-and-push         builds the 4 images in parallel and pushes them to
#                          ghcr.io/ipanga/teka-rdc/* (publication only; it never
#                          activates anything). Each leg uploads its own
#                          build-produced digest as a separate artifact.
#   release-images         validates exactly four digests for this SHA.
#   deploy                 owner approval (environment), protection recheck,
#                          then the receipt-bound host release
#                          (scripts/production-release.py).
name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

# Prevent two deploys from stepping on each other.
# Least privilege (PR 5): the workflow token can only read the repo; jobs that
# need more declare it themselves.
permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}   # resolves to: ipanga/teka-rdc

jobs:
  # Never references the environment itself. Missing environment, 401/403 on
  # the GET, admin bypass, unexpected reviewers, prevent_self_review with a
  # sole approver, or any branch policy other than exactly `main` (type
  # branch) fails closed with a fixed code, so `deploy` never starts.
  environment-preflight:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Validate production environment protection (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -B scripts/production-release.py env-gate

  build-and-push:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        # NOTE: `secrets.*` cannot be used inside `matrix.include` — the matrix
        # is evaluated at workflow-start time before the secrets context is
        # bound. Keep only literal name/dockerfile here; the "Compute build
        # args" step below fills in the Google client id via env.
        include:
          - { name: api,        dockerfile: apps/api/Dockerfile        }
          - { name: buyer-web,  dockerfile: apps/buyer-web/Dockerfile  }
          - { name: seller-web, dockerfile: apps/seller-web/Dockerfile }
          - { name: admin-web,  dockerfile: apps/admin-web/Dockerfile  }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Login to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Per-service build args. api needs none; the three web apps need the
      # API URL + Sentry config baked in at build time (Next.js NEXT_PUBLIC_*
      # are compile-time constants). seller-web and admin-web also flip the
      # basePath to empty so they serve from their subdomain root.
      #
      # Sentry build-args (per web):
      #   NEXT_PUBLIC_SENTRY_DSN_<APP>  — browser SDK DSN (public, but kept
      #                                   in Secrets for rotation flexibility)
      #   SENTRY_RELEASE                — commit SHA, tags the release in Sentry
      #
      # SENTRY_AUTH_TOKEN is NOT a build-arg — it ships via the `secrets:`
      # block on docker/build-push-action below + a `--mount=type=secret`
      # in each Dockerfile's pnpm-build RUN. Keeps the token out of every
      # image layer (silences Docker BuildKit's SecretsUsedInArgOrEnv lint).
      - name: Compute build args for ${{ matrix.name }}
        id: args
        env:
          BUYER_WEB_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN_BUYER_WEB }}
          SELLER_WEB_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN_SELLER_WEB }}
          ADMIN_WEB_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN_ADMIN_WEB }}
          BUYER_WEB_PH_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY_BUYER_WEB }}
          SELLER_WEB_PH_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY_SELLER_WEB }}
          ADMIN_WEB_PH_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY_ADMIN_WEB }}
          BUYER_WEB_CLARITY: ${{ secrets.NEXT_PUBLIC_CLARITY_PROJECT_ID_BUYER_WEB }}
        run: |
          set -eu
          case "${{ matrix.name }}" in
            api)
              echo "value=" >> "$GITHUB_OUTPUT"
              ;;
            buyer-web)
              {
                echo "value<<__END__"
                echo "NEXT_PUBLIC_API_URL=https://api.teka.cd/api"
                echo "NEXT_PUBLIC_SENTRY_DSN_BUYER_WEB=${BUYER_WEB_DSN}"
                echo "NEXT_PUBLIC_POSTHOG_KEY_BUYER_WEB=${BUYER_WEB_PH_KEY}"
                echo "NEXT_PUBLIC_CLARITY_PROJECT_ID_BUYER_WEB=${BUYER_WEB_CLARITY}"
                echo "SENTRY_RELEASE=${{ github.sha }}"
                echo "__END__"
              } >> "$GITHUB_OUTPUT"
              ;;
            seller-web)
              {
                echo "value<<__END__"
                echo "NEXT_PUBLIC_API_URL=https://api.teka.cd/api"
                echo "NEXT_PUBLIC_BASE_PATH="
                echo "NEXT_PUBLIC_SENTRY_DSN_SELLER_WEB=${SELLER_WEB_DSN}"
                echo "NEXT_PUBLIC_POSTHOG_KEY_SELLER_WEB=${SELLER_WEB_PH_KEY}"
                echo "SENTRY_RELEASE=${{ github.sha }}"
                echo "__END__"
              } >> "$GITHUB_OUTPUT"
              ;;
            admin-web)
              {
                echo "value<<__END__"
                echo "NEXT_PUBLIC_API_URL=https://api.teka.cd/api"
                echo "NEXT_PUBLIC_BASE_PATH="
                echo "NEXT_PUBLIC_SENTRY_DSN_ADMIN_WEB=${ADMIN_WEB_DSN}"
                echo "NEXT_PUBLIC_POSTHOG_KEY_ADMIN_WEB=${ADMIN_WEB_PH_KEY}"
                echo "SENTRY_RELEASE=${{ github.sha }}"
                echo "__END__"
              } >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Build and push ${{ matrix.name }}
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ steps.args.outputs.value }}
          # Mounted as /run/secrets/sentry_auth_token inside the build,
          # surfaced as $SENTRY_AUTH_TOKEN to the pnpm-build RUN via
          # the `env=` modifier in each web Dockerfile's
          # --mount=type=secret line. api's Dockerfile doesn't mount it
          # so the secret is silently ignored for that job.
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          # Tags are published for humans; deploy selects ONLY the digest.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      # Matrix job outputs overwrite each other, so each leg records its own
      # digest in its own artifact; release-images validates all four.
      - name: Record ${{ matrix.name }} digest
        env:
          SERVICE: ${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: >-
          python3 -I -B scripts/production-release.py record-digest
          --service "$SERVICE" --image "$REGISTRY/$IMAGE_PREFIX/$SERVICE"
          --sha "$GITHUB_SHA" --digest "$DIGEST"
          --out "$RUNNER_TEMP/release-digest/$SERVICE.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-digest-${{ matrix.name }}
          path: ${{ runner.temp }}/release-digest/${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 30

  release-images:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      images: ${{ steps.collect.outputs.images }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-digest-*
          path: ${{ runner.temp }}/release-digests
      # Exactly api/buyer-web/seller-web/admin-web, each once, this SHA,
      # repository prefix ghcr.io/ipanga/teka-rdc/, sha256:<64hex>.
      - name: Validate the four build digests
        id: collect
        run: >-
          python3 -I -B scripts/production-release.py collect-digests
          --dir "$RUNNER_TEMP/release-digests" --sha "$GITHUB_SHA"

  deploy:
    needs: [environment-preflight, release-images]
    if: github.ref == 'refs/heads/main' && needs.environment-preflight.result == 'success' && needs.release-images.result == 'success'
    runs-on: ubuntu-latest
    # Owner approval happens here, before any step (and so before any scp or
    # host modification). Only reached after environment-preflight passed.
    environment: production
    permissions:
      contents: read
      actions: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # First step after approval (checkout only reads the runner workspace):
      # catch protection drift between preflight and approval before ANY
      # host write.
      - name: Recheck production environment protection (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -B scripts/production-release.py env-gate
      - name: Revalidate release images
        env:
          RELEASE_IMAGES: ${{ needs.release-images.outputs.images }}
        run: >-
          python3 -I -B -c 'import importlib.util as u, os, sys;
          s = u.spec_from_file_location("pr", "scripts/production-release.py");
          m = u.module_from_spec(s); s.loader.exec_module(m);
          m.parse_images(os.environ["RELEASE_IMAGES"]); print("release images OK")'

      # Public repo files go to a STAGING dir first: the host helper writes the
      # receipt + protected snapshots (current files, api runtime, running
      # image IDs) BEFORE they are promoted into /home/deploy/teka-rdc/.
      # Background: the VPS's /home/deploy/teka-rdc/ is a flat directory, not
      # a git checkout; the 2026-05-24 outage came from a compose file that
      # never reached prod. Other VPS config (nginx, certbot data,
      # .env.production, the canonical api runtime + CA under
      # /home/deploy/.config/teka-rdc/) stays operator-managed.
      # Owned 0700 staging dir before any copy. An existing dir that is not
      # ours/0700 (or a symlink) stops here; its mode is never changed.
      - name: Prepare staging directory on VPS
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -eu
            d=/home/deploy/teka-rdc-staging
            if [ -L "$d" ] || [ -e "$d" ]; then
              if [ -L "$d" ] || [ ! -d "$d" ] || [ "$(stat -c '%u %a' "$d")" != "$(id -u) 700" ]; then
                echo 'production-release: FAIL STAGING_DIR_UNSAFE' >&2
                exit 1
              fi
            else
              (umask 077 && mkdir "$d")
            fi

      - name: Stage production compose files and helpers on VPS
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: docker-compose.prod.yml,docker-compose.db-tls.yml,scripts/production-compose.py,scripts/production-release.py,scripts/run-prod-sql.sh,apps/api/prisma/migrations/production-psql.cjs
          target: /home/deploy/teka-rdc-staging/

      - name: SSH release (receipt-bound rolling deploy)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_IMAGES: ${{ needs.release-images.outputs.images }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 30m
          envs: RELEASE_SHA,RELEASE_IMAGES,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            cd /home/deploy/teka-rdc

            # 1. Receipt + protected snapshots BEFORE sync/pull (staged helper;
            #    reads live state only, tags the running image IDs as
            #    teka-rdc-rollback/<svc>:pre-<sha>). Any absent service stops.
            python3 -I -B /home/deploy/teka-rdc-staging/scripts/production-release.py \
              snapshot --sha "$RELEASE_SHA" --images "$RELEASE_IMAGES"
            # 2. Promote the staged public files.
            python3 -I -B /home/deploy/teka-rdc-staging/scripts/production-release.py \
              install --sha "$RELEASE_SHA"

            printf '%s' "$GHCR_TOKEN" \
              | docker login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null 2>&1

            # 3. Pull the four digests (never `latest`), READ-ONLY migration
            #    ledger check in the new api image, pinned+verified
            #    docker-rollout, api SENTRY_RELEASE stamp, rollout
            #    api → buyer-web → seller-web → admin-web, live acceptance.
            #    Stops on the first failure (no retry, no whole-stack rollback,
            #    no DB change); the receipt records what is serving.
            #    Recovery is explicit and owner-run: docs/deployment.md.
            python3 -I -B scripts/production-release.py deploy --sha "$RELEASE_SHA"

            # nginx: reload if the config is valid, otherwise leave alone.
            # Recreating nginx would drop in-flight TCP connections, so we
            # never `up -d nginx` during a normal deploy.
            COMPOSE="python3 scripts/production-compose.py"
            if $COMPOSE exec nginx nginx -t >/dev/null 2>&1; then
              $COMPOSE exec nginx nginx -s reload >/dev/null 2>&1 || true
            fi

            # Dangling layers only; rollback tags keep the prior images.
            docker image prune -f >/dev/null
