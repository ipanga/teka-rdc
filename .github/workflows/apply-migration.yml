# One-off prod database migration runner (MANUAL path).
#
# NOTE (2026-07-25): expand-phase migrations can now be applied automatically
# during deploy — list the filename in
# `apps/api/prisma/migrations/manual/auto-apply.list` and deploy.yml runs it
# before the rolling swap (see docs/deployment.md §5a). Use THIS workflow only
# for migrations that must NOT auto-apply: destructive changes, or contract-phase
# steps that drop a column still read by the currently-running code, applied by
# hand at the right moment. (This workflow reads the file from the RUNNING api
# container, so the file must already be deployed — i.e. merged to `main`.)
#
# `apps/api/prisma/migrations/manual/*.sql` files ship inside the api
# image (Dockerfile COPYs the prisma/ dir). Files NOT in auto-apply.list are
# intentionally manual so each such schema change is a conscious operator
# action. Until this workflow existed, applying meant
# SSHing in and running a multi-token `docker compose ... exec api sh -c
# 'psql ...'` line that had bitten us twice with paste-collapsed `\sh`
# escaping. This workflow uses `workflow_dispatch` to wrap that into a
# point-and-click form: Actions tab → "Apply prod migration" → Run
# workflow → paste the migration filename.
#
# Concurrency-locked against itself + the production-deploy group: you
# can't fire a migration while a deploy is mid-rollout, and two
# migrations can't run simultaneously.
#
# Anyone with write access to the repo can fire this. We don't gate it
# behind a GitHub Environment approval because that's not the security
# model the deploy workflow uses either — protecting against malicious
# inside actors is the job of repo permissions + branch protection, not
# this workflow.
name: Apply prod migration

on:
  workflow_dispatch:
    inputs:
      migration:
        description: 'Migration filename in apps/api/prisma/migrations/manual/ (e.g. 2026-05-21_device_tokens.sql)'
        required: true
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Validate migration filename (defence in depth)
        env:
          MIGRATION_INPUT: ${{ inputs.migration }}
        run: |
          # Bare filename only — no path traversal (..), no slashes, no
          # leading dashes, must end in .sql. We pass this string
          # through SSH to a shell, so locking it down protects against
          # both accident and accidental injection.
          if [[ ! "$MIGRATION_INPUT" =~ ^[A-Za-z0-9._-]+\.sql$ ]]; then
            echo "::error::Migration filename must match ^[A-Za-z0-9._-]+\\.sql\$ — got: $MIGRATION_INPUT"
            exit 1
          fi
          if [[ "$MIGRATION_INPUT" == -* ]]; then
            echo "::error::Migration filename must not begin with a dash"
            exit 1
          fi
          echo "MIGRATION_FILE=$MIGRATION_INPUT" >> "$GITHUB_ENV"

      - name: SSH apply
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 5m
          envs: MIGRATION_FILE
          script: |
            set -euo pipefail

            cd /home/deploy/teka-rdc

            COMPOSE="docker compose --env-file .env.production -f docker-compose.prod.yml"

            # Verify the file is bundled inside the api image before we
            # attempt psql — gives a friendly error rather than a vague
            # `psql: ... No such file or directory` deep in the run.
            REL_PATH="prisma/migrations/manual/$MIGRATION_FILE"
            if ! $COMPOSE exec -T api test -f "$REL_PATH"; then
              echo "::error::Migration not found inside api image: $REL_PATH"
              echo "Available manual migrations:"
              $COMPOSE exec -T api ls prisma/migrations/manual || true
              exit 1
            fi

            echo "▶ applying $REL_PATH"
            # Parse DATABASE_URL with Node (JS URL handles `@` in the
            # password correctly, libpq does not) and feed psql the
            # unambiguous PG* env vars instead of the URL. Without this
            # detour, prod DBs with `@` in the password parse psql's
            # host as `<password-tail>@<real-host>` and fail to resolve.
            #
            # REL_PATH / MIGRATION_FILE are passed in as container env vars
            # rather than interpolated into the single-quoted script, which
            # keeps the quoting readable and leaves no shell-expansion seam.
            $COMPOSE exec -T \
              -e REL_PATH="$REL_PATH" \
              -e MIGRATION_FILE="$MIGRATION_FILE" \
              api sh -c '
              set -e
              eval "$(node -e "
                const u = new URL(process.env.DATABASE_URL);
                console.log(\"export PGHOST=\" + JSON.stringify(u.hostname));
                console.log(\"export PGPORT=\" + (u.port || \"5432\"));
                console.log(\"export PGUSER=\" + JSON.stringify(decodeURIComponent(u.username)));
                console.log(\"export PGPASSWORD=\" + JSON.stringify(decodeURIComponent(u.password)));
                console.log(\"export PGDATABASE=\" + JSON.stringify(u.pathname.slice(1).replace(/\\?.*/, \"\")));
              ")"

              # ON_ERROR_STOP is load-bearing. Without it psql reports the SQL
              # error but still exits 0, so a half-applied migration printed
              # "✓ migration applied" and — worse, now — would be recorded as
              # successful. With it, any error aborts before the record below.
              psql -v ON_ERROR_STOP=1 -f "$REL_PATH"

              # Bookkeeping, mirroring prisma/migrations/apply-auto.sh: the same
              # `_manual_migrations` table, the same ON CONFLICT DO NOTHING, and
              # written only AFTER the file succeeded.
              #
              # The skip is ONE-DIRECTIONAL, deliberately. A migration applied by
              # hand here is recorded, so a later auto-apply run SKIPS it
              # (apply-auto.sh checks the table first). The reverse is not true:
              # this workflow has no pre-check and always re-runs the file it is
              # given, because dispatching it is an explicit operator action and
              # re-running an idempotent migration on purpose is legitimate.
              # Safety in that direction comes from the migrations themselves
              # being idempotent, not from a skip.
              #
              # DO NOTHING keeps the FIRST applied_at. These migrations are
              # idempotent and re-running one by hand is legitimate, so the
              # useful fact is "this file has been applied to this database",
              # not when it was last replayed. RETURNING lets us say which
              # happened.
              psql -v ON_ERROR_STOP=1 -q -c \
                "CREATE TABLE IF NOT EXISTS _manual_migrations (filename text PRIMARY KEY, applied_at timestamptz NOT NULL DEFAULT now());"
              recorded=$(psql -v ON_ERROR_STOP=1 -tAq -c \
                "INSERT INTO _manual_migrations (filename) VALUES ('"'"'$MIGRATION_FILE'"'"') ON CONFLICT (filename) DO NOTHING RETURNING 1;")
              if [ "$recorded" = "1" ]; then
                echo "  ✓ recorded in _manual_migrations: $MIGRATION_FILE"
              else
                echo "  ✓ already recorded in _manual_migrations (re-run): $MIGRATION_FILE"
              fi
            '

            echo "✓ migration applied"
