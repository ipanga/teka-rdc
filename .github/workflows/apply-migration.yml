# One-off prod database migration runner (MANUAL path).
#
# NOTE (2026-07-25): expand-phase migrations can now be applied automatically
# during deploy — list the filename in
# `apps/api/prisma/migrations/manual/auto-apply.list` and deploy.yml runs it
# before the rolling swap (see docs/deployment.md §5a). Use THIS workflow only
# for migrations that must NOT auto-apply: destructive changes, or contract-phase
# steps that drop a column still read by the currently-running code, applied by
# hand at the right moment. (This workflow reads the file from the RUNNING api
# container, so the file must already be deployed — i.e. merged to `main`.)
#
# `apps/api/prisma/migrations/manual/*.sql` files ship inside the api
# image (Dockerfile COPYs the prisma/ dir). Files NOT in auto-apply.list are
# intentionally manual so each such schema change is a conscious operator
# action. Until this workflow existed, applying meant
# SSHing in and running a multi-token `docker compose ... exec api sh -c
# 'psql ...'` line that had bitten us twice with paste-collapsed `\sh`
# escaping. This workflow uses `workflow_dispatch` to wrap that into a
# point-and-click form: Actions tab → "Apply prod migration" → Run
# workflow → paste the migration filename.
#
# Concurrency-locked against itself + the production-deploy group: you
# can't fire a migration while a deploy is mid-rollout, and two
# migrations can't run simultaneously.
#
# Anyone with write access to the repo can fire this. We don't gate it
# behind a GitHub Environment approval because that's not the security
# model the deploy workflow uses either — protecting against malicious
# inside actors is the job of repo permissions + branch protection, not
# this workflow.
name: Apply prod migration

on:
  workflow_dispatch:
    inputs:
      migration:
        description: 'Migration filename in apps/api/prisma/migrations/manual/ (e.g. 2026-05-21_device_tokens.sql)'
        required: true
        type: string

# Least privilege (PR 5): the workflow token can only read the repo; jobs that
# need more declare it themselves.
permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Validate migration filename (defence in depth)
        env:
          MIGRATION_INPUT: ${{ inputs.migration }}
        run: |
          # Bare filename only — no path traversal (..), no slashes, no
          # leading dashes, must end in .sql. We pass this string
          # through SSH to a shell, so locking it down protects against
          # both accident and accidental injection.
          if [[ ! "$MIGRATION_INPUT" =~ ^[A-Za-z0-9._-]+\.sql$ ]]; then
            echo "::error::Migration filename must match ^[A-Za-z0-9._-]+\\.sql\$ — got: $MIGRATION_INPUT"
            exit 1
          fi
          if [[ "$MIGRATION_INPUT" == -* ]]; then
            echo "::error::Migration filename must not begin with a dash"
            exit 1
          fi
          echo "MIGRATION_FILE=$MIGRATION_INPUT" >> "$GITHUB_ENV"

      - name: SSH apply
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 5m
          envs: MIGRATION_FILE
          script: |
            set -euo pipefail

            cd /home/deploy/teka-rdc

            # Delegates to the host wrapper (synced by deploy.yml): it runs
            # through scripts/production-compose.py (validated runtime/CA/target)
            # and the shared runner production-psql.cjs inside the running api
            # container, which:
            #   - re-validates the bare filename and that the file is bundled in
            #     the api image (prisma/migrations/manual/<file>),
            #   - runs it with ON_ERROR_STOP (load-bearing: without it a
            #     half-applied migration would be recorded as successful),
            #   - then records it in `_manual_migrations` (same table and
            #     ON CONFLICT DO NOTHING as apply-auto.sh, written only AFTER
            #     success; DO NOTHING keeps the FIRST applied_at).
            # The skip is ONE-DIRECTIONAL, deliberately: auto-apply skips files
            # recorded here, but this workflow has no pre-check and always
            # re-runs the file it is given — an explicit operator action on an
            # idempotent migration is legitimate.
            # psql error text is suppressed (may contain customer rows); the
            # exit status still fails this step.
            bash scripts/run-prod-sql.sh --migration "$MIGRATION_FILE"

            echo "✓ migration applied"
