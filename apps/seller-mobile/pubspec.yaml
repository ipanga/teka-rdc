name: seller_mobile
description: Teka RDC - Vendeur
publish_to: 'none'
version: 0.1.10+12

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  shared_preferences: ^2.5.3
  google_fonts: ^6.2.1
  flutter_secure_storage: ^10.0.0
  pin_code_fields: ^9.1.0
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

  # --- Connectivity management (PR1, 2026-05-27) ---------------------
  # Interface-level network detection (wifi / mobile / none). Combined
  # in lib/core/connectivity/ with a reachability probe to api.teka.cd
  # /v1/health to determine actual internet access. See Rule 15 in
  # CLAUDE.md.
  connectivity_plus: ^6.0.0

  # --- Firebase Cloud Messaging (PR S1, 2026-05-22) --------------------
  # Seller push notifications. Same Firebase project (teka-rdc) as
  # buyer-mobile — separate Android + iOS apps within it bound to
  # `com.tootiye.tekaseller`. android/app/google-services.json carries
  # both packages' entries (multi-app JSON); the google-services
  # Gradle plugin picks the right one at build time based on
  # applicationId. iOS scaffold + Firebase plist landing in a future
  # PR; until then firebase_core init works on Android via the
  # generated resources.
  firebase_core: ^4.1.1
  firebase_messaging: ^16.0.3
  flutter_local_notifications: ^19.4.2
  sentry_flutter: ^9.20.0
  posthog_flutter: ^5.25.3
  file_picker: ^12.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.15
  sentry_dart_plugin: ^3.3.0
  # Generate launcher icons (adaptive + iOS) and the branded splash from the
  # brand assets in assets/brand/. Run after changing those assets:
  #   dart run flutter_launcher_icons
  #   dart run flutter_native_splash:create
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/brand/

# App launcher icon — the teka "T" glyph (white) on dark charcoal (#1A1A1A),
# distinguishing the Seller app from the red Buyer app. Full-bleed image for
# iOS + legacy Android; adaptive foreground+background color for Android 8+.
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/brand/app_icon.png"
  adaptive_icon_background: "#1A1A1A"
  adaptive_icon_foreground: "assets/brand/app_icon_foreground.png"
  min_sdk_android: 21

# Native splash (prevents a blank screen during cold start — its only job here;
# there is no in-app splash, per Google's guidance against redundant custom
# splashes). There is no Flutter-side splash or artificial delay.
#
# Seller UX PR A (2026-09-08) — root cause of the "too large / blurry" logo:
#  * Android 12+ masks `android_12.image` to a circle whose SAFE ZONE is the
#    inner 66%. The launcher foreground's T spans 65% of the canvas height, so
#    the circle clipped its crossbar and hook. `splash_icon_android12.png` is a
#    splash-only render of the same glyph at 46% height, anti-aliased. The
#    launcher icon assets are untouched.
#  * Pre-12 Android + iOS: the old `image:` was an opaque 1200 px white square
#    with a small wordmark inside; the generator sizes the CANVAS (300 dp), so
#    the wordmark rendered ~80 dp. `splash_wordmark_200dp.png` is the dark
#    wordmark trimmed and sized so the xxxhdpi/@3x source maps to ~220 dp.
#    (`splash_wordmark.png` is the WHITE wordmark — invisible on white — which
#    is why the config had been pointed at the square logo.)
#
# GENERATED (do not hand-edit; rerun `dart run flutter_native_splash:create`):
#   android/app/src/main/res/drawable*/{splash,android12splash}.png,
#   .../values{,-night}{,-v31}/styles.xml, ios LaunchImage.imageset, storyboard.
# HAND-MAINTAINED: android/.../values{,-night}-v33/styles.xml (icon_preferred
#   on Android 13+); the generator only regenerates the -v31 sidecars, so mirror
#   any -v31 change into -v33 by hand.
# POST-GENERATION (guarded by test/core/{system_ui,native_splash_assets}_test):
#   the generator re-emits `android:windowFullscreen`,
#   `android:windowDrawsSystemBarBackgrounds` and iOS `UIStatusBarHidden` as
#   false. Delete them — an earlier fullscreen-splash attempt hid the status
#   bar, and the guards assert the keys are ABSENT, not merely false.
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/brand/splash_wordmark_200dp.png
  android_12:
    color: "#FFFFFF"
    image: assets/brand/splash_icon_android12.png
    icon_background_color: "#1A1A1A"
  android: true
  ios: true
  fullscreen: false
