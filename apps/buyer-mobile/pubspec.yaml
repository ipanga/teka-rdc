name: buyer_mobile
description: Teka RDC - Acheteur
publish_to: 'none'
version: 0.1.0+2

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  shared_preferences: ^2.5.3
  google_fonts: ^6.2.1
  flutter_secure_storage: ^10.0.0
  cached_network_image: ^3.4.1
  image_picker: ^1.0.7

  # --- Universal deep linking (2026-06-23) ----------------------------
  # app_links surfaces incoming Android App Links / iOS Universal Links
  # (cold-start getInitialLink + warm uriLinkStream). url_launcher opens
  # the browser as a fallback for URLs the in-app DeepLinkParser can't map
  # (so web-only pages + SEO are never hijacked). See lib/core/deep_link/.
  app_links: ^6.3.2
  url_launcher: ^6.3.0
  # Share a product's canonical web URL (opens the app via App/Universal Links
  # when installed, else the website).
  share_plus: ^10.1.4

  # --- Connectivity management (PR1, 2026-05-27) ---------------------
  # Interface-level network detection (wifi / mobile / none). Combined
  # in lib/core/connectivity/ with a reachability probe to api.teka.cd
  # /v1/health to determine actual internet access. See Rule 15 in
  # CLAUDE.md.
  connectivity_plus: ^6.0.0

  # --- Firebase Cloud Messaging (PR B, 2026-05-22) ---------------------
  # Buyer push notifications. firebase_core auto-loads
  # android/app/google-services.json (gitignored). iOS scaffold ships in
  # PR C; until then firebase_options.dart is not generated — calling
  # `Firebase.initializeApp()` with no args works on Android because the
  # google-services Gradle plugin generates the config resources at
  # build time.
  firebase_core: ^4.1.1
  firebase_messaging: ^16.0.3
  # Surfaces FCM messages while the app is foregrounded. Android only
  # shows system notifications for backgrounded / killed apps.
  flutter_local_notifications: ^19.4.2
  sentry_flutter: ^9.20.0
  posthog_flutter: ^5.25.3

  # RFC4122 v4 UUIDs — used for the checkout idempotency key, which the API
  # validates with a strict UUID @Matches regex. Promoted from a transitive
  # dep so it can be imported directly.
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.15
  sentry_dart_plugin: ^3.3.0
  # Generate launcher icons (adaptive + iOS) and the branded splash from the
  # brand assets in assets/brand/. Run after changing those assets:
  #   dart run flutter_launcher_icons
  #   dart run flutter_native_splash:create
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
    - assets/categories/
    - assets/hero/

# App launcher icon — the teka "T" glyph (white) on brand red (#BF0000),
# distinguishing the Buyer app from the dark Seller app. Full-bleed image for
# iOS + legacy Android; adaptive foreground+background color for Android 8+.
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/brand/app_icon.png"
  adaptive_icon_background: "#BF0000"
  adaptive_icon_foreground: "assets/brand/app_icon_foreground.png"
  min_sdk_android: 21

# Native splash (prevents a blank screen during cold start — its only job here;
# there is no in-app splash, per Google's guidance against redundant custom
# splashes). iOS + Android < 12 show the colored "teka.cd" wordmark on white.
# The Android 12+ OS splash is icon-only (it masks the image to a circle and
# can't render a wide wordmark); we point it at the white "T" glyph on white so
# it stays a clean white screen that flows into the white app — deliberately not
# the heavy launcher-icon-on-red splash.
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/brand/logo_teka_cd.png
  android_12:
    color: "#FFFFFF"
    image: assets/brand/app_icon_foreground.png
  android: true
  ios: true
  fullscreen: true
