# Sentry sentry-dart-plugin configuration for buyer-mobile.
# Used by the `flutter pub run sentry_dart_plugin` step in the mobile
# workflows — Android build-mobile-apk.yml / release-mobile-aab.yml (upload
# Android `.so` debug symbols) and iOS build-mobile-ipa.yml /
# release-mobile-ipa.yml (upload iOS dSYMs). One config covers both platforms.
#
# Auth token is read from the `SENTRY_AUTH_TOKEN` env var (set by the
# workflow from a GitHub Secret). Never commit a token here.

org=teka-rdc
project=teka-buyer-mobile
url=https://sentry.io/

# Source-map upload happens automatically when a release build is
# detected. Android native symbols (NDK strip info) require
# --split-debug-info + --obfuscate on flutter build — we don't pass
# those today; add when crash stack traces become unreadable.
upload_debug_symbols=true
upload_source_maps=false

# Skip the release-finalize "set commits" call. That call needs the
# token to carry org:read AND the repo to be linked to Sentry via a
# git integration. Without both, the plugin exits non-zero after a
# successful symbol upload. We don't need per-commit issue resolution
# today, so just disable the step.
commits=false
