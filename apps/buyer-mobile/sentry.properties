# Sentry sentry-dart-plugin configuration for buyer-mobile.
# Used by the `flutter pub run sentry_dart_plugin` step in
# .github/workflows/build-mobile-apk.yml to upload Android debug symbols +
# Dart obfuscation mappings to Sentry.
#
# Auth token is read from the `SENTRY_AUTH_TOKEN` env var (set by the
# workflow from a GitHub Secret). Never commit a token here.

org=teka-rdc
project=teka-buyer-mobile
url=https://sentry.io/

# Source-map upload happens automatically when a release build is
# detected. Android native symbols (NDK strip info) require
# --split-debug-info + --obfuscate on flutter build — we don't pass
# those today; add when crash stack traces become unreadable.
upload_debug_symbols=true
upload_source_maps=false
