# Sentry CLI / sentry-dart-plugin configuration for buyer-mobile.
# Used by the `flutter pub run sentry_dart_plugin` step in
# .github/workflows/build-mobile-apk.yml to upload Android debug symbols +
# Dart obfuscation mappings (when --obfuscate is on) to Sentry.
#
# Auth token is read from the `SENTRY_AUTH_TOKEN` env var (set by the
# workflow from a GitHub Secret). Never commit a token here.
#
# Local symbol uploads (rare) work by exporting SENTRY_AUTH_TOKEN in your
# shell before invoking `flutter pub run sentry_dart_plugin`.

defaults.url=https://sentry.io/
defaults.org=teka-rdc
defaults.project=teka-buyer-mobile

# Source-map upload happens automatically by sentry-dart-plugin when a
# release build is detected. Native debug symbols (NDK strip info)
# require --split-debug-info + --obfuscate flags on the flutter build —
# we don't pass those today; add when crash stack traces become unreadable.
upload_native_symbols=true
upload_source_maps=false
