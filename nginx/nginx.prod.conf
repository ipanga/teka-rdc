worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;

    # Gzip compression
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types      text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # SSL session caching
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # ---------------------------------------------------------------
    # Real client IP behind Cloudflare (D8, 2026-09-06)
    # ---------------------------------------------------------------
    # Traffic reaches this box from Cloudflare's edge, so $remote_addr is an
    # edge IP shared by thousands of visitors. Without this block every
    # limit_req zone below (and the API's per-IP throttler, which trusts
    # X-Real-IP / X-Forwarded-For via `trust proxy 1`) would count an entire
    # Cloudflare POP as one client. CF-Connecting-IP is honoured ONLY when
    # the connecting peer is a Cloudflare address (list: cloudflare.com/ips,
    # checked 2026-09-06). Recommended companion: an origin firewall that
    # accepts 443 from these ranges only, so the header cannot be spoofed by
    # a direct connection (documented in docs/pre-scale-readiness.md, not
    # automated here).
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # Rate limiting zones — keyed on the real client IP (see above)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=10r/s;

    # Upstreams
    upstream api_upstream     { server api:5050; }
    upstream buyer_upstream   { server buyer-web:5000; }
    upstream seller_upstream  { server seller-web:5100; }
    upstream admin_upstream   { server admin-web:5200; }

    # =============================================================
    # Security headers — who owns what (D4, 2026-09-06)
    # =============================================================
    # nginx owns ONLY Strict-Transport-Security: TLS terminates here (behind
    # Cloudflare) and one STS header per host must come from one place.
    # Everything a browser evaluates about a page — CSP, X-Frame-Options,
    # nosniff, Referrer-Policy, Permissions-Policy, COOP/CORP, cache policy —
    # is emitted by the Next.js app that serves it (next.config.ts headers()
    # + middleware.ts + src/lib/security-headers.ts in each app) and by helmet
    # in the API. Two reasons: the policies differ per surface (nonce CSP on
    # seller/admin, Clarity only on the buyer), and nginx `add_header` is not
    # inherited into a location that declares its own add_header — the old
    # `/_next/static/` blocks silently shipped JS/CSS with no security
    # headers at all. Keeping the location blocks add_header-free makes HSTS
    # inherit everywhere.
    #
    # includeSubDomains: every teka.cd host this file serves is HTTPS-only
    # (port 80 only redirects). `preload` is intentionally absent — the domain
    # has not been submitted to the browser preload list; see
    # docs/pre-scale-readiness.md (D4) before adding it.
    map $host $tk_hsts {
        default "max-age=63072000; includeSubDomains";
    }

    # =============================================================
    # HTTP → HTTPS redirect (all subdomains + ACME challenge)
    # =============================================================
    server {
        listen 80 default_server;
        server_name teka.cd www.teka.cd api.teka.cd seller.teka.cd admin.teka.cd;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =============================================================
    # API — https://api.teka.cd
    # =============================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name api.teka.cd;

        # Single SAN cert covers teka.cd, api.teka.cd, seller.teka.cd, admin.teka.cd
        ssl_certificate     /etc/letsencrypt/live/teka.cd/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/teka.cd/privkey.pem;

        client_max_body_size 10M;

        add_header Strict-Transport-Security $tk_hsts always;
        # nosniff / referrer / CSP / COOP / CORP: helmet in the API (see
        # apps/api/src/common/security/http-security.ts).

        # Payment webhooks — no rate-limit beyond a soft cap; signature is verified
        # in-app and webhooks must not be blocked even under bursty retries.
        location /api/v1/payments/webhook/ {
            limit_req zone=webhook_limit burst=20 nodelay;
            proxy_pass http://api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Auth endpoints — stricter rate limiting (OTP flood protection)
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # All other API traffic
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Anything else on the API host is a 404 — don't proxy the web apps.
        location / {
            return 404;
        }
    }

    # =============================================================
    # Buyer web — https://teka.cd (+ www redirect)
    # =============================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name www.teka.cd;

        ssl_certificate     /etc/letsencrypt/live/teka.cd/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/teka.cd/privkey.pem;

        return 301 https://teka.cd$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name teka.cd;

        ssl_certificate     /etc/letsencrypt/live/teka.cd/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/teka.cd/privkey.pem;

        client_max_body_size 10M;

        add_header Strict-Transport-Security $tk_hsts always;
        # Page/asset security + cache headers come from buyer-web itself
        # (Next.js sends immutable Cache-Control for /_next/static and a 1-day
        # policy for public images/fonts) — no add_header here, so HSTS above
        # is inherited by every location.

        location /_next/static/ {
            proxy_pass http://buyer_upstream;
            proxy_set_header Host $host;
            access_log off;
        }

        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf)$ {
            proxy_pass http://buyer_upstream;
            proxy_set_header Host $host;
            access_log off;
        }

        location / {
            proxy_pass http://buyer_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # =============================================================
    # Seller portal — https://seller.teka.cd (basePath disabled in prod build)
    # =============================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name seller.teka.cd;

        ssl_certificate     /etc/letsencrypt/live/teka.cd/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/teka.cd/privkey.pem;

        client_max_body_size 10M;

        add_header Strict-Transport-Security $tk_hsts always;
        # Page/asset security + cache headers come from the app (nonce CSP per
        # request, private no-store) — no add_header in any location below.

        location /_next/static/ {
            proxy_pass http://seller_upstream;
            proxy_set_header Host $host;
            access_log off;
        }

        location / {
            proxy_pass http://seller_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # =============================================================
    # Admin portal — https://admin.teka.cd (basePath disabled in prod build)
    # =============================================================
    server {
        listen 443 ssl;
        http2 on;
        server_name admin.teka.cd;

        ssl_certificate     /etc/letsencrypt/live/teka.cd/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/teka.cd/privkey.pem;

        client_max_body_size 10M;

        add_header Strict-Transport-Security $tk_hsts always;
        # Page/asset security + cache headers come from the app (nonce CSP per
        # request, private no-store) — no add_header in any location below.

        location /_next/static/ {
            proxy_pass http://admin_upstream;
            proxy_set_header Host $host;
            access_log off;
        }

        location / {
            proxy_pass http://admin_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
